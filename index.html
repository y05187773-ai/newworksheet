<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduPrint DX - ワークシートエディタ</title>
    <!-- Tailwind CSS for styling the UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- html2pdf.js for generating PDF client-side -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <!-- Google Fonts for Web Font anti-mojibake simulation -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=BIZ+UDPMincho&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* Base styles */
        body { 
            font-family: 'Inter', 'Noto Sans JP', sans-serif; 
            background-color: #f8fafc; 
            color: #1e293b; 
            overflow: hidden; 
        }
        
        /* PDF Preview Area Container */
        .preview-wrapper {
            background-color: #cbd5e1; /* Darker background to make paper stand out */
            overflow: auto;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 2rem;
            height: 100%;
        }

        /* PDF Paper Layout Simulator (Scaled down for overview) */
        #preview-canvas-container {
            /* Container to handle scaling */
            transform-origin: top center;
            /* Adjust scale based on screen height to fit A4 */
            transform: scale(min(1, calc((100vh - 120px) / 1122.5))); 
            margin-bottom: 50px;
        }

        #preview-canvas {
            background-color: white;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            width: 210mm;
            min-height: 297mm;
            position: relative;
            flex-shrink: 0; 
            transition: outline 0.2s;
        }

        /* Outline when content exceeds A4 height */
        .overflow-warning {
            outline: 4px solid #ef4444 !important;
            box-shadow: 0 0 20px rgba(239, 68, 68, 0.4) !important;
        }

        /* Crucial PDF Prevention Styles */
        .apply-pagebreaks table, 
        .apply-pagebreaks .prevent-break,
        .apply-pagebreaks h2,
        .apply-pagebreaks h3 {
            page-break-inside: avoid;
            break-inside: avoid;
        }
        
        /* Visible Page Break Marker in Editor */
        .page-break-element {
            page-break-before: always;
            break-before: always;
            border-top: 2px dashed #3b82f6;
            margin: 20px 0;
            position: relative;
        }
        .page-break-element::before {
            content: '✂️ 改ページ ----------------------------------------------------';
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            color: #3b82f6;
            font-size: 12px;
            padding: 0 10px;
        }

        #user-content-area {
            width: 100%;
            height: 100%; /* Height is determined by content, constrained by min-height of parent */
            padding: 15mm; 
            box-sizing: border-box;
            background-color: white; 
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* WYSIWYG Editing Styles */
        [contenteditable="true"] {
            outline: none;
            cursor: text;
        }
        
        /* Selected Element Highlight */
        .selected-element {
            outline: 3px dashed #6366f1 !important;
            outline-offset: 2px;
            position: relative;
        }
        .selected-element::after {
            content: '編集中';
            position: absolute;
            top: -24px;
            right: -2px;
            background: #6366f1;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            pointer-events: none;
            font-family: sans-serif;
            z-index: 10;
        }

        /* Hide UI artifacts when exporting */
        .exporting .selected-element { outline: none !important; }
        .exporting .selected-element::after { display: none; }
        .exporting .page-break-element { border: none; }
        .exporting .page-break-element::before { display: none; }
        .exporting .overflow-warning { outline: none !important; box-shadow: none !important; }

        /* Code Textarea styles */
        .code-area { 
            font-family: 'Consolas', 'Monaco', monospace; 
            font-size: 13px; 
            resize: none; 
            tab-size: 2; 
        }

        /* --- Print Styles --- */
        @media print {
            @page { size: A4 portrait; margin: 0; }
            body * { visibility: hidden; }
            #preview-canvas, #preview-canvas * { visibility: visible; }
            #preview-canvas-container { transform: none !important; margin: 0; }
            #preview-canvas {
                position: absolute;
                left: 0; top: 0;
                width: 210mm; height: 297mm;
                margin: 0; padding: 0;
                box-shadow: none;
                outline: none !important;
            }
            .selected-element { outline: none !important; }
            .selected-element::after { display: none; }
            .page-break-element { border: none; }
            .page-break-element::before { display: none; }
        }
    </style>
</head>
<body class="flex flex-col h-screen relative">

    <!-- Overflow Warning Banner -->
    <div id="overflow-banner" class="hidden absolute top-16 left-0 right-0 bg-red-600 text-white text-center py-2 text-sm font-bold z-30 shadow-md">
        ⚠️ コンテンツがA4用紙（1枚目）の高さをはみ出しています。不要なパーツを削除するか、改ページを追加してください。
    </div>

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 h-16 flex justify-between items-center px-6 flex-shrink-0 z-40 shadow-sm relative">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 p-2 rounded-lg">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
            </div>
            <h1 class="text-xl font-bold text-gray-800 tracking-tight">EduPrint <span class="text-indigo-600">DX</span></h1>
        </div>
        
        <div class="flex items-center gap-3">
            <button onclick="window.print()" class="flex items-center gap-2 bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 px-4 py-2 rounded-lg text-sm font-semibold transition-colors">
                ブラウザ印刷
            </button>
            <button onclick="exportToPDF()" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2 rounded-lg text-sm font-semibold shadow-sm transition-colors">
                PDFダウンロード
            </button>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
        
        <!-- Left Panel: Tools -->
        <div class="w-full max-w-[360px] flex flex-col bg-white border-r border-gray-200 flex-shrink-0 z-10 shadow-lg relative">
            
            <!-- Tabs -->
            <div class="flex bg-gray-100 p-1 m-2 rounded-lg gap-1">
                <button onclick="switchTab('prompt')" id="tab-btn-prompt" class="flex-1 py-2 text-xs font-bold rounded-md bg-white text-indigo-700 shadow-sm transition-all">🤖 AI指示書</button>
                <button onclick="switchTab('code')" id="tab-btn-code" class="flex-1 py-2 text-xs font-bold rounded-md text-gray-500 hover:bg-gray-200 transition-all">📝 コード貼付</button>
                <button onclick="switchTab('design')" id="tab-btn-design" class="flex-1 py-2 text-xs font-bold rounded-md text-gray-500 hover:bg-gray-200 transition-all">🎨 編集ツール</button>
            </div>

            <!-- Tab 1: Prompt Generator -->
            <div id="tab-content-prompt" class="flex-1 flex flex-col overflow-y-auto p-4 space-y-4">
                <div class="bg-indigo-50 p-4 rounded-xl border border-indigo-100">
                    <textarea id="prompt-text" class="w-full h-80 p-3 text-xs bg-white border border-indigo-200 rounded-lg focus:outline-none" readonly>
あなたは日本の小学校教育に精通したベテラン教師であり、教材作成のプロフェッショナルです。
これから私が提示する内容をもとに、日本の学校で実際に配布されるような、読みやすく書き込みやすいワークシートを作成してください。

【重要：出力プロセス】
この依頼は「確認プロセス」を含みます。以下の手順を厳守してください。

1. 【分析と提案フェーズ】
   まず、ワークシートの構成案（タイトル、大問の数と内容、解答欄の配置、考慮した教育的配慮）を提示し、私に確認を求めてください。
   
2. 【承認後の出力フェーズ】
   私が提案に同意したら、以下の要件を満たしたHTMLとCSSを出力してください。

【日本のワークシート構造要件】
- ページ右上に「年・組・氏名・日付」の記入欄を必須で配置すること。
- タイトルは左上に配置し、大きく明示すること。
- 日本語フォントを前提とし、可読性（UDフォントに近いデザイン）を意識すること。
- 大問は「１．」「２．」と番号を振り、インデントを揃えて視覚的に整理すること。
- 解答欄は「枠」または「適切な長さの下線（border-bottom）」で、鉛筆で書きやすいサイズを確保すること。
- 表などは適切にレイアウトし、A4サイズに必ず収めること。

【システム要件】
- 確実に「A4サイズ1枚」に収まるレイアウト・分量にすること。
- HTMLとCSSのみを出力すること。JavaScriptは不要。
- HTMLは <body> タグの中身（コンテンツ部分）のみを出力すること。
- 途中で改ページされて困るブロックは、必ず <div class="prevent-break"> で囲むこと。
- 要素間の余白は <br> の連打ではなく、CSSの margin や padding で調整すること。

まずは【1. 分析と提案フェーズ】から開始してください。
</textarea>
                    <button onclick="copyPrompt()" class="w-full mt-3 bg-indigo-600 hover:bg-indigo-700 text-white py-2 rounded-lg text-sm font-bold transition-all">
                        📋 コピーする
                    </button>
                </div>
            </div>

            <!-- Tab 2: Code Input -->
            <div id="tab-content-code" class="hidden flex-1 flex-col p-4 space-y-4">
                <p class="text-xs text-gray-600">AIが出力したコードをここに貼り付けて、「反映する」を押してください。</p>
                <div class="flex-1 flex flex-col gap-2">
                    <label class="text-xs font-bold text-gray-700">HTML</label>
                    <textarea id="html-input" class="flex-1 w-full p-2 border border-gray-300 rounded-lg code-area" placeholder="ここにHTMLを貼り付け..."></textarea>
                </div>
                <div class="flex-1 flex flex-col gap-2">
                    <label class="text-xs font-bold text-gray-700">CSS</label>
                    <textarea id="css-input" class="flex-1 w-full p-2 border border-gray-300 rounded-lg code-area" placeholder="ここにCSSを貼り付け..."></textarea>
                </div>
                <button onclick="applyCodeToPreview()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-lg text-sm font-bold transition-all">
                    ✨ プレビューに反映する
                </button>
            </div>

            <!-- Tab 3: Design Tools (WYSIWYG) -->
            <div id="tab-content-design" class="hidden flex-1 flex-col overflow-y-auto bg-gray-50">
                
                <div class="p-4 bg-yellow-50 border-b border-yellow-200 shadow-inner">
                    <p class="text-xs text-yellow-800 font-medium">
                        💡 <b>使い方：</b>右側の用紙で、変更したい文字や枠を<b>クリック</b>すると、ここで色や大きさを変更できます。文字は直接キーボードで打ち直せます。
                    </p>
                </div>

                <!-- Properties Panel (Shown when element is selected) -->
                <div id="properties-panel" class="p-4 space-y-5 opacity-50 pointer-events-none transition-opacity">
                    
                    <div class="flex justify-between items-center border-b border-gray-200 pb-2">
                        <span class="text-sm font-bold text-gray-700">選択中のパーツ</span>
                        <span id="selected-tag-name" class="text-xs bg-gray-200 text-gray-600 px-2 py-1 rounded font-mono">未選択</span>
                    </div>

                    <!-- Styling Controls -->
                    <div class="space-y-4">
                        <!-- Font Size -->
                        <div>
                            <label class="flex justify-between text-xs font-bold text-gray-600 mb-1">
                                文字の大きさ <span id="font-size-val">--</span>
                            </label>
                            <input type="range" id="input-fontsize" min="10" max="60" value="16" class="w-full accent-indigo-600" oninput="applyStyle('fontSize', this.value + 'px')">
                        </div>

                        <!-- Height (for boxes/rows) -->
                        <div>
                            <label class="flex justify-between text-xs font-bold text-gray-600 mb-1">
                                枠の高さ (行間) <span id="height-val">--</span>
                            </label>
                            <input type="range" id="input-height" min="10" max="300" value="50" class="w-full accent-teal-600" oninput="applyStyle('height', this.value + 'px')">
                        </div>

                        <!-- Colors -->
                        <div class="flex gap-4">
                            <div class="flex-1">
                                <label class="block text-xs font-bold text-gray-600 mb-1">文字色</label>
                                <input type="color" id="input-color" class="w-full h-8 rounded cursor-pointer" oninput="applyStyle('color', this.value)">
                            </div>
                            <div class="flex-1">
                                <label class="block text-xs font-bold text-gray-600 mb-1">背景色</label>
                                <input type="color" id="input-bgcolor" class="w-full h-8 rounded cursor-pointer" oninput="applyStyle('backgroundColor', this.value)">
                            </div>
                        </div>

                        <!-- Font Family -->
                        <div>
                            <label class="block text-xs font-bold text-gray-600 mb-1">文字の種類 (フォント)</label>
                            <select id="input-fontfamily" class="w-full p-2 border border-gray-300 rounded text-sm bg-white" onchange="applyStyle('fontFamily', this.value)">
                                <option value="'Noto Sans JP', sans-serif">標準 (ゴシック体)</option>
                                <option value="'Noto Serif JP', serif">明朝体</option>
                                <option value="'BIZ UDPMincho', serif">教科書体 (UD明朝)</option>
                            </select>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="pt-4 border-t border-gray-200">
                        <button onclick="deleteSelectedElement()" class="w-full flex items-center justify-center gap-2 bg-red-50 text-red-600 hover:bg-red-100 border border-red-200 py-2 rounded-lg text-sm font-bold transition-all shadow-sm">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            このパーツを削除
                        </button>
                    </div>
                </div>

                <!-- Add Elements -->
                <div class="p-4 mt-auto border-t border-gray-200 bg-white shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                    <p class="text-xs font-bold text-gray-600 mb-2">パーツを追加する</p>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="addElement('<h2 style=\'font-size:18px; margin:10px 0;\'>新しい見出し</h2>')" class="px-2 py-2 bg-gray-50 hover:bg-gray-100 text-gray-700 text-xs rounded border border-gray-300 shadow-sm transition">＋ 見出し</button>
                        <button onclick="addElement('<p style=\'margin:10px 0;\'>新しいテキストを入力...</p>')" class="px-2 py-2 bg-gray-50 hover:bg-gray-100 text-gray-700 text-xs rounded border border-gray-300 shadow-sm transition">＋ テキスト</button>
                        <button onclick="addElement('<div style=\'border:1px solid #000; height:100px; padding:10px; margin:10px 0; border-radius:4px;\'>新しい枠</div>')" class="px-2 py-2 bg-gray-50 hover:bg-gray-100 text-gray-700 text-xs rounded border border-gray-300 shadow-sm transition">＋ 記入枠</button>
                        <button onclick="addElement('<div class=\'page-break-element\'></div>')" class="px-2 py-2 bg-blue-50 text-blue-700 hover:bg-blue-100 text-xs rounded border border-blue-200 shadow-sm transition font-bold">✂️ 改ページ追加</button>
                    </div>
                </div>
            </div>

        </div>

        <!-- Right Panel: Live PDF Preview -->
        <div class="flex-1 preview-wrapper" id="preview-container" onclick="handlePreviewClick(event)">
            <!-- Paper Simulator -->
            <div id="preview-canvas-container">
                <div id="preview-canvas" class="apply-pagebreaks font-[Noto_Sans_JP] transition-all duration-300">
                    <div id="user-content-area"></div>
                    <style id="user-style-area"></style>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast Notifications -->
    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-3"></div>

    <script>
        const contentArea = document.getElementById('user-content-area');
        const styleArea = document.getElementById('user-style-area');
        const htmlInput = document.getElementById('html-input');
        const cssInput = document.getElementById('css-input');
        const previewCanvas = document.getElementById('preview-canvas');
        const overflowBanner = document.getElementById('overflow-banner');
        
        let currentSelectedElement = null;

        window.onload = () => {
            const defaultHtml = `
<div style="display: flex; justify-content: space-between; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px;">
    <h1 style="font-size: 24px; margin: 0;">国語 ワークシート</h1>
    <p style="font-size: 14px; margin: 0; align-self: flex-end;">年　組　名前：　　　　　　　　</p>
</div>
<h2 style="font-size: 18px; border-left: 4px solid #4f46e5; padding-left: 8px; margin-bottom: 10px; font-family: 'BIZ UDPMincho', serif;">1. 次の文章を読んで、あとの問いに答えましょう。</h2>
<div style="border: 1px solid #ccc; padding: 15px; margin-bottom: 20px; line-height: 1.8; font-family: 'BIZ UDPMincho', serif;">
    　ここに文章が入ります。AIに自動生成させたテキストや、教科書の文章を配置します。改行も反映されます。<br>　文字をクリックすると、自由に打ち直すことができます。
</div>
<table style="width: 100%; border-collapse: collapse; margin-bottom: 20px;">
    <tr>
        <th style="border: 1px solid #000; padding: 8px; background: #f3f4f6; width:30%;">問1の答え</th>
        <td style="border: 1px solid #000; padding: 8px; height: 60px;"></td>
    </tr>
    <tr>
        <th style="border: 1px solid #000; padding: 8px; background: #f3f4f6;">問2の答え</th>
        <td style="border: 1px solid #000; padding: 8px; height: 60px;"></td>
    </tr>
</table>
`;
            htmlInput.value = defaultHtml.trim();
            applyCodeToPreview();
            
            // Adjust zoom on resize
            window.addEventListener('resize', adjustZoom);
            adjustZoom();
        };

        function adjustZoom() {
            const container = document.getElementById('preview-canvas-container');
            // 1122.5px is roughly 297mm (A4 height) at 96 DPI
            // We scale it down so the whole height fits in the viewport minus header/padding
            const availableHeight = window.innerHeight - 150; 
            const scale = Math.min(1, availableHeight / 1122.5);
            container.style.transform = `scale(${scale})`;
        }

        function switchTab(tabId) {
            ['prompt', 'code', 'design'].forEach(id => {
                document.getElementById(`tab-content-${id}`).classList.add('hidden');
                document.getElementById(`tab-content-${id}`).classList.remove('flex');
                document.getElementById(`tab-btn-${id}`).className = "flex-1 py-2 text-xs font-bold rounded-md text-gray-500 hover:bg-gray-200 transition-all";
            });

            document.getElementById(`tab-content-${tabId}`).classList.remove('hidden');
            document.getElementById(`tab-content-${tabId}`).classList.add('flex');
            
            let colorClass = tabId === 'prompt' ? 'text-indigo-700' : tabId === 'code' ? 'text-emerald-700' : 'text-yellow-700';
            document.getElementById(`tab-btn-${tabId}`).className = `flex-1 py-2 text-xs font-bold rounded-md bg-white ${colorClass} shadow-sm transition-all`;

            if (tabId === 'design') {
                makeElementsEditable();
            }
        }

        function copyPrompt() {
            const text = document.getElementById('prompt-text').value;
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showToast('プロンプトをコピーしました！', 'success');
            } catch (err) {
                showToast('コピーに失敗しました', 'error');
            }
            document.body.removeChild(textArea);
        }

        function applyCodeToPreview() {
            contentArea.innerHTML = htmlInput.value;
            styleArea.innerHTML = cssInput.value;
            deselectElement();
            makeElementsEditable();
            checkOverflow();
            showToast('プレビューに反映しました', 'success');
            switchTab('design');
        }

        function makeElementsEditable() {
            const elements = contentArea.querySelectorAll('*');
            elements.forEach(el => {
                if (['H1', 'H2', 'H3', 'P', 'SPAN', 'TD', 'TH', 'DIV'].includes(el.tagName) && !el.classList.contains('page-break-element')) {
                    el.setAttribute('contenteditable', 'true');
                    el.addEventListener('keydown', (e) => {
                        if (e.key === 'Enter' && el.tagName !== 'DIV') {
                            e.preventDefault();
                            document.execCommand('insertLineBreak');
                        }
                    });
                }
            });
        }

        function handlePreviewClick(event) {
            if (!contentArea.contains(event.target) && event.target !== contentArea) return;
            let target = event.target;
            if (target === contentArea) return;

            selectElement(target);
        }

        function selectElement(el) {
            deselectElement();
            currentSelectedElement = el;
            currentSelectedElement.classList.add('selected-element');
            
            const panel = document.getElementById('properties-panel');
            panel.classList.remove('opacity-50', 'pointer-events-none');
            
            let tagName = el.tagName.toLowerCase();
            if(el.classList.contains('page-break-element')) tagName = '改ページ';
            document.getElementById('selected-tag-name').textContent = `<${tagName}>`;

            const computed = window.getComputedStyle(el);
            
            const fontSize = parseInt(computed.fontSize);
            document.getElementById('input-fontsize').value = fontSize || 16;
            document.getElementById('font-size-val').textContent = (fontSize || 16) + 'px';

            const height = parseInt(computed.height);
            document.getElementById('input-height').value = height || 50;
            document.getElementById('height-val').textContent = (height || 50) + 'px';

            document.getElementById('input-color').value = rgbToHex(computed.color);
            let bgColor = computed.backgroundColor;
            if (bgColor === 'rgba(0, 0, 0, 0)' || bgColor === 'transparent') bgColor = '#ffffff';
            document.getElementById('input-bgcolor').value = rgbToHex(bgColor);
            
            // Check Font Family
            const fontFam = computed.fontFamily;
            const fontSelect = document.getElementById('input-fontfamily');
            if (fontFam.includes('BIZ')) {
                fontSelect.value = "'BIZ UDPMincho', serif";
            } else if (fontFam.includes('Serif')) {
                fontSelect.value = "'Noto Serif JP', serif";
            } else {
                fontSelect.value = "'Noto Sans JP', sans-serif";
            }
        }

        function deselectElement() {
            if (currentSelectedElement) {
                currentSelectedElement.classList.remove('selected-element');
                currentSelectedElement = null;
                
                const panel = document.getElementById('properties-panel');
                panel.classList.add('opacity-50', 'pointer-events-none');
                document.getElementById('selected-tag-name').textContent = '未選択';
            }
        }

        function applyStyle(property, value) {
            if (!currentSelectedElement) return;
            currentSelectedElement.style[property] = value;
            
            if (property === 'fontSize') document.getElementById('font-size-val').textContent = value;
            if (property === 'height') document.getElementById('height-val').textContent = value;
            
            syncHTMLToTextarea();
            checkOverflow();
        }

        function deleteSelectedElement() {
            if (!currentSelectedElement) return;
            currentSelectedElement.remove();
            deselectElement();
            syncHTMLToTextarea();
            checkOverflow();
            showToast('パーツを削除しました', 'info');
        }

        function addElement(htmlString) {
            const div = document.createElement('div');
            div.innerHTML = htmlString;
            const newEl = div.firstElementChild;
            
            if (currentSelectedElement && currentSelectedElement.parentNode) {
                currentSelectedElement.parentNode.insertBefore(newEl, currentSelectedElement.nextSibling);
            } else {
                contentArea.appendChild(newEl);
            }
            
            makeElementsEditable();
            syncHTMLToTextarea();
            checkOverflow();
            selectElement(newEl);
        }

        function syncHTMLToTextarea() {
            const clone = contentArea.cloneNode(true);
            clone.querySelectorAll('.selected-element').forEach(el => el.classList.remove('selected-element'));
            clone.querySelectorAll('[contenteditable]').forEach(el => el.removeAttribute('contenteditable'));
            htmlInput.value = clone.innerHTML;
        }

        contentArea.addEventListener('input', () => {
            syncHTMLToTextarea();
            checkOverflow();
        });

        // A4 Paper Height Check
        function checkOverflow() {
            // A4 pixel height approximation at 96 DPI (297mm)
            const a4HeightPx = 1122.5; 
            // Get actual height of user content
            const contentHeight = contentArea.scrollHeight;
            
            // Check if there's no manual page break, and content exceeds A4 height
            const hasPageBreak = contentArea.querySelector('.page-break-element') !== null;
            
            if (contentHeight > a4HeightPx && !hasPageBreak) {
                previewCanvas.classList.add('overflow-warning');
                overflowBanner.classList.remove('hidden');
            } else {
                previewCanvas.classList.remove('overflow-warning');
                overflowBanner.classList.add('hidden');
            }
        }

        function rgbToHex(rgb) {
            if (rgb.startsWith('#')) return rgb;
            const match = rgb.match(/^rgba?\((\d+),\s*(\d+),\s*(\d+)/);
            if (!match) return '#000000';
            const r = parseInt(match[1]).toString(16).padStart(2, '0');
            const g = parseInt(match[2]).toString(16).padStart(2, '0');
            const b = parseInt(match[3]).toString(16).padStart(2, '0');
            return `#${r}${g}${b}`;
        }

        document.addEventListener('click', (e) => {
            const designTab = document.getElementById('tab-content-design');
            const previewCanvas = document.getElementById('preview-canvas');
            if (currentSelectedElement && !designTab.contains(e.target) && !previewCanvas.contains(e.target)) {
                deselectElement();
            }
        });

        function exportToPDF() {
            deselectElement(); 
            previewCanvas.classList.remove('overflow-warning');
            showToast('PDF生成を開始しています...', 'info');
            
            const element = document.getElementById('preview-canvas');
            element.classList.add('exporting');

            const opt = {
                // Ensure no margin pushes the content off-center
                margin:       0,
                filename:     'worksheet.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                // scale 2 increases resolution, windowWidth matches A4 mm to px roughly
                html2canvas:  { scale: 2, useCORS: true, windowWidth: 794 },
                // Use format 'a4' to guarantee exact dimensions
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' },
                pagebreak:    { mode: ['css', 'legacy'] }
            };

            html2pdf().set(opt).from(element).save().then(() => {
                element.classList.remove('exporting');
                checkOverflow(); // Re-evaluate outline
                showToast('PDFのダウンロードが完了しました！', 'success');
            }).catch(err => {
                console.error(err);
                element.classList.remove('exporting');
                showToast('エラーが発生しました', 'error');
            });
        }

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            let bgColor = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-red-500' : 'bg-gray-800';
            toast.className = `${bgColor} text-white px-4 py-3 rounded-lg shadow-xl transform transition-all duration-300 translate-y-10 opacity-0 flex items-center font-medium text-sm`;
            toast.innerHTML = `<span>${message}</span>`;
            document.getElementById('toast-container').appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-10', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
